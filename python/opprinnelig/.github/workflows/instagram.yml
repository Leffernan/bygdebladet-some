name: Instagram-postar

on:
  schedule:
    # GitHub brukar UTC. Kvar tid står to gonger, éin for vintertid og éin for sommartid.
    # Norsk tid: 06.00, 13.00, 17.00 og 21.30. Ekstrakøyringane finn ingen nye saker og sender ingenting.
    - cron: "0 4,5,11,12,15,16 * * *"
    - cron: "30 19,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hent saker og send postar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python hent_saker.py
      - name: Lagre kva saker som er sende
        if: always()
        run: |
          git config user.name "instagram-postar"
          git config user.email "actions@users.noreply.github.com"
          git add sett.json
          git diff --cached --quiet || (git commit -m "Oppdater sett.json" && git push)
